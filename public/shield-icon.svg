  </defs>
  <!-- Outer Shield -->
  <path d="M50 5 L85 20 V50 C85 75 50 95 50 95 C50 95 15 75 15 50 V20 L50 5 Z" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
