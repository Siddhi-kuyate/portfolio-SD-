      <stop offset="0%" stop-color="#E2C27E"/>
      <stop offset="50%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#9E7E36"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2F23"/>
