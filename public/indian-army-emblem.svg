<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Antique Gold Gradient -->
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C9"/>
      <stop offset="50%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#9E7E36"/>
    </linearGradient>
  </defs>
  
  <!-- Crossed Swords (Scimitars / Kirpans) -->
  <g stroke="url(#emblemGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left to Right Sword -->
    <path d="M22 98 L98 22" />
    <path d="M18 94 L26 102" />
    <path d="M28 88 L14 102" stroke-width="4" />
    <circle cx="14" cy="102" r="3" fill="url(#emblemGold)" />
    
    <!-- Right to Left Sword -->
    <path d="M98 98 L22 22" />
    <path d="M102 94 L94 102" />
    <path d="M92 88 L106 102" stroke-width="4" />
    <circle cx="106" cy="102" r="3" fill="url(#emblemGold)" />
  </g>

  <!-- Ashoka Lion Capital Motif (Stylized Emblem) -->
  <g fill="url(#emblemGold)" transform="translate(42, 12) scale(0.6)">
    <!-- Base Pedestal -->
    <rect x="5" y="42" width="50" height="8" rx="2" />
    <!-- Center Ashoka Chakra Motif -->
    <circle cx="30" cy="46" r="3" fill="#101410" stroke="url(#emblemGold)" stroke-width="1" />
    <!-- Center Lion -->
    <path d="M25 15 C25 8, 35 8, 35 15 C38 18, 40 25, 38 32 C36 38, 24 38, 22 32 C20 25, 22 18, 25 15 Z" />
    <!-- Left Lion Mane Silhouette -->
    <path d="M12 24 C10 18, 18 12, 23 16 C20 22, 21 28, 16 34 C12 30, 11 26, 12 24 Z" />
    <!-- Right Lion Mane Silhouette -->
    <path d="M48 24 C50 18, 42 12, 37 16 C40 22, 39 28, 44 34 C48 30, 49 26, 48 24 Z" />
    <!-- Crown / Crest Top -->
    <path d="M26 8 L30 3 L34 8 Z" />
  </g>

  <!-- Star of Valour at intersection -->
  <polygon points="60,54 62,58 66,58 63,61 64,65 60,63 56,65 57,61 54,58 58,58" fill="url(#emblemGold)" />
</svg>
